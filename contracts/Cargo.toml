[workspace]
resolver = "2"
members = ["blacklist", "dispute", "escrow", "htlc", "quicklendx-contracts", "oracle", "router", "vault"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace.lints.rust]
unused_variables = "warn"
